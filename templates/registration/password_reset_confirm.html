{% extends "base.html" %}
{% block title %}Neues Passwort · Helpdesk{% endblock %}
{% block content %}
<div class="login">
  <h1>Neues Passwort</h1>
  {% if validlink %}
    <form method="post" class="panel">{% csrf_token %}
      {% include "_form.html" %}
      <button class="btn primary" type="submit">Passwort speichern</button>
    </form>
  {% else %}
    <div class="panel">
      <p>Dieser Link ist ungültig oder wurde schon benutzt.</p>
      <p><a href="{% url 'password_reset' %}">Neuen Link anfordern</a></p>
    </div>
  {% endif %}
</div>
{% endblock %}
