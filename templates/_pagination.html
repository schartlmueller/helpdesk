{% if page.has_other_pages %}
  <nav class="pager" aria-label="Seiten">
    {% if page.has_previous %}
      <a class="btn small" href="?{% if params %}{{ params }}&amp;{% endif %}seite={{ page.previous_page_number }}">← Zurück</a>
    {% endif %}
    <span class="muted">Seite {{ page.number }} von {{ page.paginator.num_pages }} · {{ page.paginator.count }} Einträge</span>
    {% if page.has_next %}
      <a class="btn small" href="?{% if params %}{{ params }}&amp;{% endif %}seite={{ page.next_page_number }}">Weiter →</a>
    {% endif %}
  </nav>
{% endif %}
